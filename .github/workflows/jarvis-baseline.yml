name: JARVIS PR baseline

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number: open or API-confirmed merged history (manual observation, not a PR-head event check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  baseline:
    name: JARVIS baseline (not tests or merge approval)
    if: github.repository_owner == 'honabochi' && ((github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open') || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    # Only jobs that run can replace an inspection. Manual observations have
    # their own group, since they cannot replace PR-event evidence.
    concurrency:
      group: jarvis-baseline-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trusted workflow commit only (never candidate code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/jarvis
          sparse-checkout-cone-mode: false
      - name: Verify release hash and inspect bounded metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          JARVIS_BASELINE_CORE_SHA: 84729f84a11bac40e8dbdedc7b3b0c2473d262fa
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const hash = crypto.createHash("sha256").update(fs.readFileSync(".github/jarvis/pr-baseline.mjs")).digest("hex"); if (hash !== "8a3740a24fe968c2a8c7c46bd66a14c1463ffecac6b268175b7b9827685b1c91") process.exit(1);'
          node .github/jarvis/pr-baseline.mjs
      - name: Retain bounded PR baseline result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jarvis-pr-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jarvis-pr-baseline-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
